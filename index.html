<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Календарь занятости Zoom</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a}.app{max-width:1400px;margin:auto}.section{background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(15,23,42,.06);margin-bottom:20px}.top{padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.label,.hint{color:#64748b;font-size:14px}.label{font-weight:700}h1{margin:6px 0 0;font-size:26px;letter-spacing:-.03em}.controls,.people,.add{display:flex;gap:8px;flex-wrap:wrap}.btn,.addbtn{border:1px solid #e2e8f0;background:#fff;color:#0f172a;border-radius:16px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer}.btn:hover{background:#f8fafc}.peoplebox,.adminbox{padding:20px}.title{margin-bottom:12px;color:#475569;font-size:14px;font-weight:800}.subtle{font-size:12px;color:#64748b;margin-top:4px}.pwrap{display:inline-flex}.pbtn,.xbtn{border:1px solid currentColor;font-weight:800;cursor:pointer}.pbtn{border-radius:999px 0 0 999px;padding:9px 13px;font-size:14px;opacity:.82}.xbtn{border-left:0;border-radius:0 999px 999px 0;padding:9px 10px;font-size:15px;opacity:.72}.pbtn.single{border-radius:999px}.pbtn.selected{opacity:1;outline:3px solid #334155;box-shadow:0 8px 18px rgba(15,23,42,.16);transform:scale(1.04);z-index:1}.add{margin-top:16px}.inp,.select,.timeinp{min-width:180px;border:1px solid #e2e8f0;border-radius:16px;padding:10px 14px;font-size:14px;outline:0;background:white}.inp:focus,.select:focus,.timeinp:focus{border-color:#94a3b8;box-shadow:0 0 0 3px #f1f5f9}.addbtn{background:#0f172a;color:white;border-color:#0f172a}.cal{overflow:hidden}.calhead{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:16px;align-items:center;font-weight:800}.pill{border-radius:999px;padding:6px 10px;border:1px solid currentColor;font-size:13px;font-weight:800;display:inline-flex;margin-left:6px}.sync{font-size:12px;color:#64748b;margin-left:8px}.tw{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px}th,td{border:1px solid #e2e8f0;padding:6px;text-align:center;vertical-align:middle}th{background:#f8fafc;color:#475569;height:42px;font-size:12px;font-weight:800}.date{position:sticky;left:0;z-index:2;background:white;min-width:145px;text-align:left;font-weight:800}thead .date{background:#f8fafc;z-index:4}.small{margin-top:4px;font-size:11px;color:#94a3b8;font-weight:400}.slot,.book,.fixed{min-height:50px;width:100%;border-radius:16px;border:1px solid currentColor;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px}.slot{background:white;color:#cbd5e1;cursor:pointer}.slot:hover{background:#f8fafc;color:#64748b;transform:scale(1.02)}.book{cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.08)}.book:hover{transform:scale(1.015)}.fixed{cursor:not-allowed;box-shadow:0 4px 12px rgba(15,23,42,.08)}.back{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:50}.modal{width:100%;max-width:430px;background:white;border-radius:26px;padding:24px;box-shadow:0 24px 70px rgba(15,23,42,.28)}.shield{width:48px;height:48px;border-radius:18px;background:#ffe4e6;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}.modal h2{margin:0;font-size:22px}.modal p{color:#64748b;line-height:1.5;font-size:14px;margin:8px 0 0}.details{background:#f8fafc;border-radius:18px;padding:14px;margin-top:16px;font-size:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.muted{color:#64748b}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.cancel,.del{border:0;border-radius:16px;padding:11px 16px;font-weight:800;cursor:pointer}.cancel{background:white;border:1px solid #e2e8f0;color:#334155}.del{background:#e11d48;color:white}.admin-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr 2fr auto;gap:8px}.fixed-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.fixed-chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;border:1px solid currentColor}.chip-x{border:0;background:transparent;color:inherit;font-weight:900;cursor:pointer;opacity:.7;font-size:15px}.chip-x:hover{opacity:1}.error{margin-top:12px;color:#e11d48;font-size:14px;font-weight:800}.p-rose{background:#fecdd3;color:#881337}.p-orange{background:#fed7aa;color:#7c2d12}.p-amber{background:#fde68a;color:#78350f}.p-yellow{background:#fef08a;color:#713f12}.p-lime{background:#d9f99d;color:#365314}.p-emerald{background:#a7f3d0;color:#064e3b}.p-teal{background:#99f6e4;color:#134e4a}.p-cyan{background:#a5f3fc;color:#164e63}.p-sky{background:#bae6fd;color:#0c4a6e}.p-blue{background:#bfdbfe;color:#1e3a8a}.p-violet{background:#ddd6fe;color:#4c1d95}.p-fuchsia{background:#f5d0fe;color:#701a75}.p-pink{background:#fbcfe8;color:#831843}.p-purple{background:#e9d5ff;color:#581c87}.p-indigo{background:#c7d2fe;color:#312e81}.f-indigo{background:#e0e7ff;color:#312e81}.f-emerald{background:#d1fae5;color:#064e3b}.f-sky{background:#e0f2fe;color:#075985}.f-pink{background:#fce7f3;color:#831843}.f-amber{background:#fef3c7;color:#78350f}.f-violet{background:#ede9fe;color:#4c1d95}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.inp,.select,.timeinp,.addbtn{width:100%;min-width:0}}@media(max-width:760px){body{padding:14px}.top,.admin-top{flex-direction:column;align-items:flex-start}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<section class="section top"><div><div class="label">Календарь занятости Zoom</div><h1 id="weekTitle">Неделя</h1></div><div class="controls"><button class="btn" id="prevWeek">←</button><button class="btn" id="currentWeek">Текущая неделя</button><button class="btn" id="nextWeek">→</button></div></section>
<section class="section peoplebox"><div class="title">Кто бронирует слот</div><div id="peopleHint" class="subtle"></div><div id="peopleList" class="people"></div><div id="personEdit" class="add"><input id="newPersonInput" class="inp" placeholder="Новое имя"><button id="addPersonBtn" class="addbtn">Добавить пользователя</button></div></section>
<section class="section adminbox"><div class="admin-top"><div><div class="title" style="margin-bottom:0">Закреплённые интервалы</div><div class="subtle">Редактирование доступно только администратору</div></div><button class="btn" id="logoutAdmin" style="display:none">Выйти</button></div><div id="adminLogin" class="add"><input id="adminPassword" class="inp" type="password" placeholder="Пароль для редактирования"><button id="loginAdmin" class="addbtn">Открыть редактирование</button></div><div id="adminPanel" style="display:none"><div class="admin-grid"><select id="fixedDay" class="select"></select><input id="fixedStart" class="timeinp" type="time" step="1800" value="09:00"><input id="fixedEnd" class="timeinp" type="time" step="1800" value="10:00"><input id="fixedTitle" class="inp" placeholder="Название интервала"><button id="addFixed" class="addbtn">Добавить</button></div><div id="fixedList" class="fixed-list"></div></div><div id="adminError" class="error"></div></section>
<section class="section cal"><div class="calhead"><div>📅 <span id="calendarWeekLabel">Неделя</span><span id="syncStatus" class="sync">загрузка…</span></div><div>Выбрано: <span id="selectedBadge" class="pill"></span></div></div><div class="tw"><table id="calendarTable"></table></div></section>
</div>
<div id="modalBackdrop" class="back"><div class="modal"><div class="shield">🛡️</div><h2>Удалить бронь?</h2><p>Этот слот уже занят. Подтверди удаление, чтобы случайно не убрать бронь.</p><div class="details"><div class="row"><span class="muted">Кто</span><strong id="modalPerson"></strong></div><div class="row"><span class="muted">Дата</span><strong id="modalDate"></strong></div><div class="row"><span class="muted">Время</span><strong id="modalTime"></strong></div></div><div class="actions"><button class="cancel" id="cancelDelete">Оставить</button><button class="del" id="confirmDelete">Удалить бронь</button></div></div></div>
<iframe name="hiddenPostFrame" style="display:none"></iframe>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbx53WfEvOgMSB63RukEY54IsLHURmSWgIdLgNvcP5L1IeSHS5ed_uUuccAk4HlBzqigJw/exec";
const ADMIN_PASSWORD="zoom2026";
const COLORS=["p-rose","p-orange","p-amber","p-yellow","p-lime","p-emerald","p-teal","p-cyan","p-sky","p-blue","p-violet","p-fuchsia","p-pink","p-purple","p-indigo"];
const FIXED_COLORS=["f-indigo","f-emerald","f-sky","f-pink","f-amber","f-violet"];
const WEEKDAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
let people=["Оля В","Оля А","Вероника","Саша","Даша","Настя","Аня","Маша Б","Маша С","Катя","Наташа С","Наталья"].map((name,i)=>({name,cls:COLORS[i%COLORS.length]}));
let fixedEvents={0:[{start:"09:00",end:"10:00",title:"Планёрка найм АТП",cls:FIXED_COLORS[0]}],1:[{start:"09:00",end:"10:00",title:"Планёрка адаптация",cls:FIXED_COLORS[1]},{start:"10:00",end:"11:00",title:"Планёрка найм офис",cls:FIXED_COLORS[2]}],2:[{start:"09:00",end:"10:00",title:"Планёрка найм АТП",cls:FIXED_COLORS[0]}],3:[{start:"09:00",end:"10:00",title:"Планёрка найм офис",cls:FIXED_COLORS[2]}],4:[{start:"14:00",end:"15:00",title:"WELCOME",cls:FIXED_COLORS[3]}]};
let bookingsByWeek={},selectedPerson=people[0].name,pendingDelete=null,weekOffset=0,isAdmin=false,isApplyingRemote=false;
const slots=Array.from({length:21},(_,i)=>540+i*30);

function stateToRows(){
  const rows=[];
  people.forEach(p=>rows.push({type:"person",week:"",day:"",time:"",title:p.name,mode:p.cls}));
  Object.entries(bookingsByWeek).forEach(([week,days])=>Object.entries(days||{}).forEach(([day,times])=>Object.entries(times||{}).forEach(([time,title])=>rows.push({type:"booking",week,day,time,title,mode:""}))));
  Object.entries(fixedEvents).forEach(([day,events])=>(events||[]).forEach(ev=>rows.push({type:"fixed",week:"",day,time:ev.start,title:ev.title,mode:ev.end+"|"+ev.cls})));
  rows.push({type:"settings",week:"",day:"",time:"selectedPerson",title:selectedPerson,mode:""});
  return rows;
}
function rowsToState(rows){
  const nextPeople=[], nextBookings={}, nextFixed={};
  let nextSelected="";
  (rows||[]).forEach(item=>{
    if(item.type==="person")nextPeople.push({name:item.title,cls:item.mode||COLORS[nextPeople.length%COLORS.length]});
    else if(item.type==="booking"){const week=item.week,d=String(item.day);if(!nextBookings[week])nextBookings[week]={};if(!nextBookings[week][d])nextBookings[week][d]={};nextBookings[week][d][item.time]=item.title;}
    else if(item.type==="fixed"){const d=String(item.day),parts=String(item.mode||"").split("|");if(!nextFixed[d])nextFixed[d]=[];nextFixed[d].push({start:item.time,end:parts[0]||item.time,title:item.title,cls:parts[1]||FIXED_COLORS[0]});}
    else if(item.type==="settings"&&item.time==="selectedPerson")nextSelected=item.title||"";
  });
  if(nextPeople.length)people=nextPeople;
  bookingsByWeek=nextBookings;
  if(Object.keys(nextFixed).length)fixedEvents=nextFixed;
  if(nextSelected&&people.some(p=>p.name===nextSelected))selectedPerson=nextSelected;
  else if(!people.some(p=>p.name===selectedPerson))selectedPerson=people[0].name;
}
function setSyncStatus(text){document.getElementById("syncStatus").textContent=text;}
function loadFromSheet(){
  const callback="sheetCallback_"+Date.now();
  window[callback]=function(rows){isApplyingRemote=true;rowsToState(rows);isApplyingRemote=false;setSyncStatus("сохранено в таблице");render();delete window[callback];const old=document.getElementById(callback);if(old)old.remove();};
  const s=document.createElement("script");
  s.id=callback;
  s.src=APPS_SCRIPT_URL+"?callback="+callback+"&_="+Date.now();
  s.onerror=function(){setSyncStatus("ошибка загрузки таблицы");};
  document.body.appendChild(s);
}
function saveToSheet(){
  if(isApplyingRemote)return;
  setSyncStatus("сохраняю…");
  const form=document.createElement("form");
  form.method="POST";form.action=APPS_SCRIPT_URL;form.target="hiddenPostFrame";form.style.display="none";
  const input=document.createElement("input");input.name="payload";input.value=JSON.stringify(stateToRows());
  form.appendChild(input);document.body.appendChild(form);form.submit();
  setTimeout(()=>{form.remove();setSyncStatus("сохранено");loadFromSheet();},900);
}
function monday(date=new Date()){const d=new Date(date),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d}
function addDays(date,days){const d=new Date(date);d.setDate(d.getDate()+days);return d}
function dateKey(d){return d.toISOString().slice(0,10)}
function dayLabel(d){return new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"2-digit",month:"2-digit"}).format(d)}
function slotLabel(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function toMin(t){const p=t.split(":").map(Number);return p[0]*60+p[1]}
function weekStart(){return addDays(monday(),weekOffset*7)}
function weekKey(){return dateKey(weekStart())}
function bookings(){return bookingsByWeek[weekKey()]||{}}
function personMap(){return Object.fromEntries(people.map(p=>[p.name,p]))}
function fixedStart(day,t){return (fixedEvents[day]||[]).find(e=>e.start===t)||null}
function fixedInside(day,t){const m=toMin(t);return (fixedEvents[day]||[]).some(e=>m>toMin(e.start)&&m<toMin(e.end))}
function fixedByTime(day,t){const m=toMin(t);return (fixedEvents[day]||[]).find(e=>m>=toMin(e.start)&&m<toMin(e.end))||null}
function spanFixed(e){return (toMin(e.end)-toMin(e.start))/30}
function spanBooking(dayBookings,startIndex){const t=slotLabel(slots[startIndex]),name=dayBookings[t];let span=1;for(let i=startIndex+1;i<slots.length;i++){if(dayBookings[slotLabel(slots[i])]!==name)break;span++}return span}
function hiddenBooking(dayBookings,idx){const t=slotLabel(slots[idx]),name=dayBookings[t];if(!name||idx===0)return false;return dayBookings[slotLabel(slots[idx-1])]===name}
function hasFixedOverlap(day,start,end){const sm=toMin(start),em=toMin(end);return (fixedEvents[day]||[]).some(e=>sm<toMin(e.end)&&em>toMin(e.start))}
function addPerson(){const input=document.getElementById("newPersonInput"),name=input.value.trim();if(!name)return;if(people.some(p=>p.name.toLowerCase()===name.toLowerCase())){input.value="";return}people.push({name,cls:COLORS[people.length%COLORS.length]});selectedPerson=name;input.value="";saveToSheet();render()}
function deletePerson(name){if(people.length===1)return;if(!confirm("Удалить пользователя «"+name+"»?"))return;people=people.filter(p=>p.name!==name);if(selectedPerson===name)selectedPerson=people[0].name;saveToSheet();render()}
function loginAdmin(){const pass=document.getElementById("adminPassword").value;if(pass===ADMIN_PASSWORD){isAdmin=true;document.getElementById("adminPassword").value="";setAdminError("");render()}else setAdminError("Неверный пароль")}
function logoutAdmin(){isAdmin=false;setAdminError("");render()}
function setAdminError(msg){document.getElementById("adminError").textContent=msg||""}
function addFixedEvent(){const day=Number(document.getElementById("fixedDay").value),start=document.getElementById("fixedStart").value,end=document.getElementById("fixedEnd").value,title=document.getElementById("fixedTitle").value.trim();if(!title){setAdminError("Добавь название интервала");return}if(toMin(end)<=toMin(start)){setAdminError("Время окончания должно быть позже начала");return}if(hasFixedOverlap(day,start,end)){setAdminError("Этот закреплённый интервал пересекается с другим");return}const event={start,end,title,cls:FIXED_COLORS[(fixedEvents[day]||[]).length%FIXED_COLORS.length]};fixedEvents[day]=[...(fixedEvents[day]||[]),event].sort((a,b)=>toMin(a.start)-toMin(b.start));document.getElementById("fixedTitle").value="";setAdminError("");saveToSheet();render()}
function deleteFixed(day,index){fixedEvents[day]=(fixedEvents[day]||[]).filter((_,i)=>i!==index);saveToSheet();render()}
function toggleBooking(day,slot){const t=slotLabel(slot);if(fixedByTime(day,t))return;if(!personMap()[selectedPerson])return;const wk=weekKey(),wb=bookingsByWeek[wk]||{},db=wb[day]||{},booked=db[t];if(booked){pendingDelete={dayIndex:day,time:t,bookedBy:booked};openModal();return}bookingsByWeek[wk]={...wb,[day]:{...db,[t]:selectedPerson}};saveToSheet();render()}
function openModal(){const d=addDays(weekStart(),pendingDelete.dayIndex);document.getElementById("modalPerson").textContent=pendingDelete.bookedBy;document.getElementById("modalDate").textContent=dayLabel(d);document.getElementById("modalTime").textContent=pendingDelete.time;document.getElementById("modalBackdrop").style.display="flex"}
function closeModal(){pendingDelete=null;document.getElementById("modalBackdrop").style.display="none"}
function confirmDelete(){if(!pendingDelete)return;const wk=weekKey(),wb=bookingsByWeek[wk]||{},db={...(wb[pendingDelete.dayIndex]||{})};delete db[pendingDelete.time];bookingsByWeek[wk]={...wb,[pendingDelete.dayIndex]:db};saveToSheet();closeModal();render()}
function slotFromMergedClick(event,startSlot,span){const rect=event.currentTarget.getBoundingClientRect();const x=event.clientX-rect.left;const part=Math.min(span-1,Math.max(0,Math.floor((x/rect.width)*span)));return startSlot+part*30}
function renderPeople(){document.getElementById("personEdit").style.display=isAdmin?"flex":"none";document.getElementById("peopleHint").textContent=isAdmin?"":"Редактирование списка доступно только администратору";const box=document.getElementById("peopleList");box.innerHTML="";people.forEach(p=>{const w=document.createElement("span");w.className="pwrap";const b=document.createElement("button");b.className="pbtn "+p.cls+(selectedPerson===p.name?" selected":"")+(isAdmin?"":" single");b.textContent=p.name;b.onclick=()=>{selectedPerson=p.name;saveToSheet();render()};w.appendChild(b);if(isAdmin){const x=document.createElement("button");x.className="xbtn "+p.cls;x.textContent="×";x.title="Удалить "+p.name;x.disabled=people.length===1;x.onclick=()=>deletePerson(p.name);if(people.length===1){x.style.opacity=".35";x.style.cursor="not-allowed"}w.appendChild(x)}box.appendChild(w)});const sel=personMap()[selectedPerson]||people[0],badge=document.getElementById("selectedBadge");badge.textContent=sel.name;badge.className="pill "+sel.cls}
function renderAdmin(){document.getElementById("adminLogin").style.display=isAdmin?"none":"flex";document.getElementById("adminPanel").style.display=isAdmin?"block":"none";document.getElementById("logoutAdmin").style.display=isAdmin?"inline-block":"none";const select=document.getElementById("fixedDay");if(!select.dataset.ready){WEEKDAYS.forEach((d,i)=>{const o=document.createElement("option");o.value=i;o.textContent=d;select.appendChild(o)});select.dataset.ready="1"}const list=document.getElementById("fixedList");list.innerHTML="";Object.entries(fixedEvents).forEach(([day,events])=>{events.forEach((e,i)=>{const chip=document.createElement("span");chip.className="fixed-chip "+e.cls;chip.appendChild(document.createTextNode(WEEKDAYS[Number(day)]+": "+e.start+"–"+e.end+" · "+e.title));const x=document.createElement("button");x.className="chip-x";x.textContent="×";x.onclick=()=>deleteFixed(Number(day),i);chip.appendChild(x);list.appendChild(chip)})})}
function renderCalendar(){const ws=weekStart(),we=addDays(ws,6),days=Array.from({length:7},(_,i)=>addDays(ws,i)),book=bookings(),pm=personMap();document.getElementById("weekTitle").textContent="Неделя: "+dayLabel(ws)+" — "+dayLabel(we);document.getElementById("calendarWeekLabel").textContent="Неделя от "+dayLabel(ws);const table=document.getElementById("calendarTable");table.innerHTML="";const thead=document.createElement("thead"),hr=document.createElement("tr"),dh=document.createElement("th");dh.textContent="Дата";dh.className="date";hr.appendChild(dh);slots.forEach(s=>{const th=document.createElement("th");th.textContent=slotLabel(s);hr.appendChild(th)});thead.appendChild(hr);table.appendChild(thead);const tbody=document.createElement("tbody");days.forEach((day,di)=>{const tr=document.createElement("tr"),dt=document.createElement("td");dt.className="date";dt.innerHTML="<div>"+dayLabel(day)+"</div><div class='small'>"+dateKey(day)+"</div>";tr.appendChild(dt);slots.forEach((slot,si)=>{const t=slotLabel(slot),fix=fixedStart(di,t),hiddenFix=fixedInside(di,t),db=book[di]||{},booked=db[t],hiddenBook=hiddenBooking(db,si);if(hiddenFix||hiddenBook)return;const td=document.createElement("td");if(fix){td.colSpan=spanFixed(fix);const div=document.createElement("div");div.className="fixed "+fix.cls;div.textContent=fix.title;div.title=fix.title+": "+fix.start+"–"+fix.end;td.appendChild(div);tr.appendChild(td);return}if(booked){const p=pm[booked]||{name:booked,cls:"p-indigo"},span=spanBooking(db,si),end=slotLabel(slot+span*30);td.colSpan=span;const btn=document.createElement("button");btn.className="book "+p.cls;btn.textContent=booked;btn.title=dayLabel(day)+" "+t+"–"+end+" — "+booked;btn.onclick=(event)=>toggleBooking(di,slotFromMergedClick(event,slot,span));td.appendChild(btn);tr.appendChild(td);return}const btn=document.createElement("button");btn.className="slot";btn.textContent="+";btn.onclick=()=>toggleBooking(di,slot);td.appendChild(btn);tr.appendChild(td)});tbody.appendChild(tr)});table.appendChild(tbody)}
function render(){renderPeople();renderAdmin();renderCalendar()}
document.getElementById("prevWeek").onclick=()=>{weekOffset--;render()};
document.getElementById("currentWeek").onclick=()=>{weekOffset=0;render()};
document.getElementById("nextWeek").onclick=()=>{weekOffset++;render()};
document.getElementById("addPersonBtn").onclick=addPerson;
document.getElementById("newPersonInput").addEventListener("keydown",e=>{if(e.key==="Enter")addPerson()});
document.getElementById("loginAdmin").onclick=loginAdmin;
document.getElementById("adminPassword").addEventListener("keydown",e=>{if(e.key==="Enter")loginAdmin()});
document.getElementById("logoutAdmin").onclick=logoutAdmin;
document.getElementById("addFixed").onclick=addFixedEvent;
document.getElementById("cancelDelete").onclick=closeModal;
document.getElementById("confirmDelete").onclick=confirmDelete;
document.getElementById("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")closeModal()};
render();
loadFromSheet();
</script>
</body>
</html>
